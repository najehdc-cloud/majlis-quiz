<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#120c33">
<title>Majlis Quiz</title>
<style>
  :root { --a0: #e5384f; --a1: #2f7bff; --a2: #f2b705; --a3: #1fb86a; --muted: #b9b3e0; --card: rgba(255,255,255,.08); --line: rgba(255,255,255,.16); }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body { color: #fff; font-family: -apple-system, "Segoe UI", Roboto, "Noto Sans Arabic", Tahoma, sans-serif; overscroll-behavior: none;
    background: radial-gradient(600px 400px at 0% 0%, #3b1d8f, transparent 60%), radial-gradient(600px 400px at 100% 100%, #0e4a8a, transparent 60%), #120c33;
    min-height: 100%; }
  .view { display: none; min-height: 100vh; min-height: 100dvh; padding: 22px 18px calc(22px + env(safe-area-inset-bottom)); flex-direction: column; }
  .view.on { display: flex; animation: in .3s ease; }
  @keyframes in { from { opacity: 0; transform: translateY(10px) } to { opacity: 1; transform: none } }
  .logo { font-size: 30px; font-weight: 900; text-align: center; }
  .logo span { background: linear-gradient(90deg, #ffcc33, #ff5f8f, #8f7bff); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .sub { text-align: center; color: var(--muted); margin-top: 4px; font-size: 15px; }
  label { display: block; font-weight: 700; margin: 26px 0 10px; font-size: 16px; }
  input { width: 100%; font-size: 22px; padding: 16px 18px; border-radius: 16px; border: 2px solid var(--line); background: rgba(255,255,255,.08);
    color: #fff; outline: none; font-family: inherit; }
  input:focus { border-color: #ff5f8f; }
  .avs { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; }
  .avs button { aspect-ratio: 1; font-size: 30px; border-radius: 16px; border: 2px solid transparent; background: var(--card); cursor: pointer; }
  .avs button.sel { border-color: #ffcc33; background: rgba(255,204,51,.18); transform: scale(1.06); }
  .btn { margin-top: 26px; width: 100%; font-size: 22px; font-weight: 900; padding: 18px; border: none; border-radius: 18px; color: #fff; cursor: pointer;
    background: linear-gradient(135deg, #ff5f8f, #8f5bff); box-shadow: 0 8px 0 rgba(0,0,0,.25); font-family: inherit; }
  .btn:active { transform: translateY(4px); box-shadow: 0 4px 0 rgba(0,0,0,.25); }
  .btn[disabled] { opacity: .5; }
  .err { color: #ff8a9b; text-align: center; margin-top: 12px; min-height: 20px; font-weight: 600; }

  .me { display: flex; align-items: center; gap: 12px; padding: 10px 14px; background: var(--card); border: 1px solid var(--line); border-radius: 16px; }
  .me .av { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; font-size: 28px; background: rgba(255,255,255,.1); box-shadow: 0 0 0 3px var(--pc, #8f7bff); }
  .me .nm { flex: 1; font-weight: 800; font-size: 18px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .me .sc { font-weight: 900; font-size: 20px; }
  .center { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 10px; }
  .big { font-size: 84px; line-height: 1; }
  .title { font-size: 28px; font-weight: 900; }
  .muted { color: var(--muted); font-size: 17px; }
  .bounce { animation: bounce 1.2s ease-in-out infinite; }
  @keyframes bounce { 50% { transform: translateY(-12px) } }

  .qhead { display: flex; justify-content: space-between; align-items: center; margin: 14px 2px 10px; color: var(--muted); font-weight: 700; font-size: 15px; }
  .qhead .t { color: #fff; font-weight: 900; font-size: 20px; }
  .qmini { font-size: 18px; font-weight: 700; line-height: 1.3; margin-bottom: 12px; color: #eee; }
  .grid4 { flex: 1; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 12px; min-height: 340px; }
  .opt { border: none; border-radius: 22px; color: #fff; font-family: inherit; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 8px; padding: 10px; cursor: pointer; box-shadow: 0 8px 0 rgba(0,0,0,.25); font-weight: 800; font-size: 17px; line-height: 1.2; }
  .opt .sh { font-size: 52px; line-height: 1; }
  .opt:active { transform: translateY(5px) scale(.98); box-shadow: 0 3px 0 rgba(0,0,0,.25); }
  .o0 { background: var(--a0) } .o1 { background: var(--a1) } .o2 { background: var(--a2); color: #1b1300 } .o3 { background: var(--a3) }

  .result { border-radius: 26px; padding: 30px 20px; width: 100%; }
  .result.good { background: linear-gradient(135deg, #1fb86a, #0e7a47); }
  .result.bad { background: linear-gradient(135deg, #e5384f, #93182a); }
  .result.none { background: var(--card); border: 1px solid var(--line); }
  .pts { font-size: 44px; font-weight: 900; margin-top: 6px; }
  .rankbox { margin-top: 16px; font-size: 20px; font-weight: 800; }
  .medal { font-size: 100px; }
  #room { text-transform: uppercase; letter-spacing: 8px; font-weight: 900; text-align: center; direction: ltr; }
  .btn2 { margin-top: 12px; width: 100%; font-size: 18px; font-weight: 800; padding: 14px; border-radius: 16px; color: #fff; cursor: pointer;
    background: rgba(255,255,255,.1); border: 2px solid var(--line); font-family: inherit; }
  .roster { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 14px; max-width: 100%; }
  .roster span { background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; font-size: 15px; font-weight: 700; }
  .roomtag { text-align: center; color: var(--muted); font-size: 14px; margin-top: 6px; direction: ltr; }
  .remote .qmini { font-size: 22px; }
  .answerline { margin-top: 12px; font-size: 17px; font-weight: 700; }
  .factbox { margin-top: 14px; font-size: 15px; line-height: 1.4; background: rgba(0,0,0,.2); border-radius: 14px; padding: 10px 12px; text-align: start; }
</style>
</head>
<body>

<!-- JOIN -->
<section class="view" id="vJoin">
  <div class="logo" id="logo"></div>
  <div class="sub" data-t="joinSub"></div>
  <div id="roomBox" style="display:none">
    <label for="room" data-t="roomCode"></label>
    <input id="room" maxlength="5" autocomplete="off" autocapitalize="characters" placeholder="ABCDE">
  </div>
  <div class="roomtag" id="roomTag"></div>
  <label for="name" data-t="yourName"></label>
  <input id="name" maxlength="16" autocomplete="off" autocapitalize="words" enterkeyhint="go">
  <label data-t="pickAvatar"></label>
  <div class="avs" id="avs"></div>
  <button class="btn" id="joinBtn" data-t="join"></button>
  <div class="err" id="err"></div>
</section>

<!-- WAITING (lobby / countdown) -->
<section class="view" id="vWait">
  <div class="me" id="me1"></div>
  <div class="center">
    <div class="big bounce" id="waitIcon">📺</div>
    <div class="title" id="waitTitle"></div>
    <div class="muted" id="waitSub"></div>
    <div class="roster" id="roster"></div>
  </div>
  <button class="btn2" id="inviteBtn" style="display:none" data-t="invite"></button>
  <button class="btn" id="startBtn" style="display:none"></button>
</section>

<!-- ANSWER -->
<section class="view" id="vAnswer">
  <div class="me" id="me2"></div>
  <div class="qhead"><span id="qn"></span><span class="t" id="qt"></span></div>
  <div class="qmini" id="qq"></div>
  <div class="grid4" id="opts"></div>
</section>

<!-- RESULT -->
<section class="view" id="vResult">
  <div class="me" id="me3"></div>
  <div class="center"><div class="result" id="result"></div></div>
</section>

<!-- FINAL -->
<section class="view" id="vFinal">
  <div class="me" id="me4"></div>
  <div class="center">
    <div class="medal" id="medal"></div>
    <div class="title" id="finalTitle"></div>
    <div class="muted" id="finalSub"></div>
  </div>
  <button class="btn" id="againBtn" style="display:none"></button>
</section>

<script src="config.js"></script>
<script src="cloud.js"></script>
<script>
"use strict";
var T = {
  en: { joinSub: "Join the game on the TV", yourName: "Your name", pickAvatar: "Pick your avatar", join: "Join game 🚀",
        needName: "Please enter your name", roomCode: "Room code", needRoom: "Enter the 5-letter room code shown on the TV", noRoom: "Room not found — check the code or ask the host for a new link", cloudErr: "Can't connect to the game. Check your internet.", invite: "📤 Invite friends", copied: "Link copied — paste it to your friends", lookHost: "The host will start the game soon", getReadyQ: "The question is coming…", answerWas: "Answer:", room: "Room", joined: "players joined", inviteText: "Join my Majlis Quiz game!", cantReach: "Can't reach the TV. Are you on the same Wi-Fi?", full: "Game is full",
        youreIn: "You're in!", lookTv: "Look at the TV — the game starts soon", hostStart: "▶ Start the game", hostHint: "You're the host — start when everyone has joined",
        getReady: "Get ready…", eyes: "Eyes on the TV!", question: "Question", locked: "Answer locked in!", waitOthers: "Waiting for the others…",
        correct: "Correct!", wrong: "Not this time", noAnswer: "Too slow!", rank: "You're in place", of: "of", pts: "pts", streak: "in a row",
        gameOver: "Game over", finalPlace: "You finished in place", again: "▶ Play again", waitHost: "Waiting for the host to play again", lostTv: "Reconnecting to the TV…" },
  ar: { joinSub: "انضم إلى اللعبة على التلفاز", yourName: "اسمك", pickAvatar: "اختر شخصيتك", join: "انضم 🚀",
        needName: "الرجاء إدخال اسمك", roomCode: "رمز الغرفة", needRoom: "أدخل رمز الغرفة المكوّن من 5 أحرف الظاهر على التلفاز", noRoom: "الغرفة غير موجودة — تحقق من الرمز أو اطلب رابطاً جديداً من المضيف", cloudErr: "تعذّر الاتصال باللعبة. تحقق من الإنترنت.", invite: "📤 ادعُ أصدقاءك", copied: "تم نسخ الرابط — أرسله لأصدقائك", lookHost: "سيبدأ المضيف اللعبة قريباً", getReadyQ: "السؤال قادم…", answerWas: "الإجابة:", room: "الغرفة", joined: "لاعبين انضموا", inviteText: "انضم إلى لعبتي في مجلس كويز!", cantReach: "تعذّر الوصول إلى التلفاز. هل أنت على نفس شبكة الواي فاي؟", full: "اكتمل عدد اللاعبين",
        youreIn: "أنت في اللعبة!", lookTv: "انظر إلى التلفاز — ستبدأ اللعبة قريباً", hostStart: "▶ ابدأ اللعبة", hostHint: "أنت المضيف — ابدأ عندما ينضم الجميع",
        getReady: "استعد…", eyes: "انظر إلى التلفاز!", question: "السؤال", locked: "تم تسجيل إجابتك!", waitOthers: "بانتظار الآخرين…",
        correct: "إجابة صحيحة!", wrong: "ليست هذه المرة", noAnswer: "انتهى الوقت!", rank: "ترتيبك", of: "من", pts: "نقطة", streak: "متتالية",
        gameOver: "انتهت اللعبة", finalPlace: "أنهيت في المركز", again: "▶ العب مجدداً", waitHost: "بانتظار المضيف لبدء جولة جديدة", lostTv: "جارٍ إعادة الاتصال بالتلفاز…" }
};
var AVATARS = ["🦁", "🐯", "🦊", "🐼", "🐨", "🐸", "🐵", "🦄", "🐙", "🦉", "🐢", "🐬", "🦅", "🐫", "⚽", "🚀", "🌟", "🍉"];
var SHAPES = ["▲", "◆", "●", "■"];

var lang = "en", me = null, state = null, answeredQ = -1, myChoice = -1, failures = 0, avatar = AVATARS[Math.floor(Math.random() * AVATARS.length)];
function $(id) { return document.getElementById(id); }
function t(k) { return T[lang][k] || k; }
function load() { try { return JSON.parse(localStorage.getItem("majlisQuiz") || "null"); } catch (e) { return null; } }
function save(v) { try { localStorage.setItem("majlisQuiz", JSON.stringify(v)); } catch (e) {} }

function setLang(l) {
  if (l !== "en" && l !== "ar") return;
  if (l === lang && document.documentElement.dir) return;
  lang = l; document.documentElement.lang = l; document.documentElement.dir = l === "ar" ? "rtl" : "ltr";
  var n = document.querySelectorAll("[data-t]");
  for (var i = 0; i < n.length; i++) n[i].textContent = t(n[i].getAttribute("data-t"));
  $("logo").innerHTML = l === "ar" ? "<span>مجلس</span> كويز" : "Majlis <span>Quiz</span>";
  $("name").placeholder = l === "ar" ? "مثال: سارة" : "e.g. Sara";
}
function show(id) { var v = document.querySelectorAll(".view"); for (var i = 0; i < v.length; i++) v[i].classList.toggle("on", v[i].id === id); }
function buzz(ms) { try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) {} }

// ---------- Join ----------
(function initJoin() {
  var box = $("avs");
  AVATARS.forEach(function (a) {
    var b = document.createElement("button"); b.type = "button"; b.textContent = a;
    if (a === avatar) b.className = "sel";
    b.onclick = function () { avatar = a; var s = box.children; for (var i = 0; i < s.length; i++) s[i].className = s[i] === b ? "sel" : ""; buzz(10); };
    box.appendChild(b);
  });
  var saved = load();
  if (saved && saved.name) $("name").value = saved.name;
  if (saved && saved.avatar) { avatar = saved.avatar; var s = box.children; for (var i = 0; i < s.length; i++) s[i].className = s[i].textContent === avatar ? "sel" : ""; }
  $("joinBtn").onclick = join;
  $("name").addEventListener("keydown", function (e) { if (e.key === "Enter") join(); });
})();

// ---------- Network: online (Firebase room link) or local (served by the TV on Wi-Fi) ----------
function qs(k) { var m = new RegExp("[?&]" + k + "=([^&#]*)").exec(location.search); return m ? decodeURIComponent(m[1]) : ""; }
function cleanCode(c) { return String(c || "").toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 5); }
var ROOM = cleanCode(qs("r"));
// Served by the TV itself (port 8765) = home Wi-Fi mode; served from the web (GitHub Pages) = online mode.
var CLOUD = !!(window.MQCloud && new MQCloud.Client("x").enabled() && location.port !== "8765");
var cloud = null, watcher = null, beat = null;

function connectRoom() {
  $("roomBox").style.display = "none";
  $("roomTag").textContent = t("room") + " " + ROOM;
  if (!cloud) cloud = new MQCloud.Client("mqPhone");
  return cloud.signIn().then(function () {
    if (watcher) watcher.close();
    var first = true;
    watcher = cloud.watch("rooms/" + ROOM + "/state", function (v) {
      if (!v) { if (first) roomMissing(); first = false; return; }
      first = false; failures = 0; state = v; render();
    });
  }).catch(function () { show("vJoin"); $("err").textContent = t("cloudErr"); });
}
function roomMissing() {
  state = null; show("vJoin");
  $("roomBox").style.display = "block"; $("roomTag").textContent = "";
  $("err").textContent = ROOM ? t("noRoom") : t("needRoom");
}
function push(type, extra) {
  var body = { uid: cloud.uid, type: type, t: { ".sv": "timestamp" } };
  for (var k in extra) body[k] = extra[k];
  return cloud.req("POST", "rooms/" + ROOM + "/in", body);
}
function heartbeat() {
  if (!CLOUD || !cloud || !cloud.uid || !ROOM) return;
  cloud.req("PUT", "rooms/" + ROOM + "/seen/" + cloud.uid, { ".sv": "timestamp" }).catch(function () {});
}
function sendAction(type, extra) {
  if (CLOUD) return push(type, extra || {}).catch(function () {});
  var q = "id=" + me.id;
  for (var k in (extra || {})) q += "&" + k + "=" + encodeURIComponent(extra[k]);
  return fetch("/api/" + type + "?" + q, { method: "POST", cache: "no-store" }).catch(function () {});
}

function join() {
  if (CLOUD && !ROOM) {
    var code = cleanCode($("room").value);
    if (code.length !== 5) { $("err").textContent = t("needRoom"); return; }
    ROOM = code;
    try { history.replaceState(null, "", location.pathname + "?r=" + code); } catch (e) {}
    connectRoom().then(function () { setTimeout(function () { if (state) join(); }, 1200); });
    return;
  }
  var name = $("name").value.trim();
  if (!name) { $("err").textContent = t("needName"); return; }
  $("joinBtn").disabled = true; $("err").textContent = "";
  var p;
  if (CLOUD) {
    if (!state) { $("joinBtn").disabled = false; roomMissing(); return; }
    p = push("join", { name: name, avatar: avatar }).then(function () { return { id: cloud.uid }; });
  } else {
    p = fetch("/api/join?name=" + encodeURIComponent(name) + "&avatar=" + encodeURIComponent(avatar), { method: "POST", cache: "no-store" })
      .then(function (r) { if (!r.ok) throw 0; return r.json(); });
  }
  p.then(function (r) {
      me = { id: r.id, name: name, avatar: avatar, session: state ? state.session : null, room: ROOM };
      save(me); buzz(30); heartbeat(); render();
    })
    .catch(function () { $("err").textContent = t(CLOUD ? "cloudErr" : "cantReach"); })
    .then(function () { $("joinBtn").disabled = false; });
}

function invite() {
  var url = location.origin + location.pathname + "?r=" + ROOM;
  buzz(20);
  if (navigator.share) { navigator.share({ title: "Majlis Quiz", text: t("inviteText"), url: url }).catch(function () {}); return; }
  var done = function () { $("waitSub").textContent = t("copied"); };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(url).then(done, function () { prompt("", url); });
  else prompt("", url);
}
$("inviteBtn").onclick = invite;

// ---------- Actions ----------
function answer(i) {
  if (!state || state.phase !== "question" || answeredQ === state.qIndex) return;
  answeredQ = state.qIndex; myChoice = i; buzz(40);
  sendAction("answer", { q: state.qIndex, choice: i });
  render();
}
function hostStart() { buzz(30); sendAction("start"); }
$("startBtn").onclick = hostStart;
$("againBtn").onclick = hostStart;

// ---------- Polling ----------
function poll() {
  fetch("/api/state" + (me ? "?id=" + me.id : ""), { cache: "no-store" })
    .then(function (r) { return r.json(); })
    .then(function (s) { failures = 0; state = s; render(); })
    .catch(function () { if (++failures > 4 && me) { show("vWait"); $("waitIcon").textContent = "📡"; $("waitTitle").textContent = t("lostTv"); $("waitSub").textContent = ""; } })
    .then(function () { setTimeout(poll, 600); });
}

function meBar(id, p) {
  var b = $(id); b.innerHTML = "";
  var av = document.createElement("div"); av.className = "av"; av.textContent = p.avatar; av.style.setProperty("--pc", p.color || "#8f7bff");
  var nm = document.createElement("div"); nm.className = "nm"; nm.textContent = p.name;
  var sc = document.createElement("div"); sc.className = "sc"; sc.textContent = (p.score || 0) + " " + t("pts");
  b.appendChild(av); b.appendChild(nm); b.appendChild(sc);
}

function render() {
  if (!state) return;
  setLang(state.lang || "en");
  var saved = me || load();
  // Recover identity after a page reload, but only for the same TV session.
  if (!me && saved && saved.id && state.players && state.players[saved.id]) { me = saved; me.session = state.session; save(me); }
  var p = me && state.players ? state.players[me.id] : null;
  if (me && !p) {
    // Not (yet) registered on the TV. Right after joining that's normal; if the TV restarted, rejoin.
    if (me.session && me.session !== state.session) { me = null; }
    else { me.session = state.session; save(me); show("vWait"); $("waitIcon").textContent = "⏳"; $("waitTitle").textContent = t("youreIn"); $("waitSub").textContent = t("lookTv"); return; }
  }
  if (!me) { show("vJoin"); return; }
  var all = ["me1", "me2", "me3", "me4"]; for (var i = 0; i < all.length; i++) meBar(all[i], p);
  var isHost = state.hostId === me.id, ph = state.phase;

  if (ph === "lobby" || ph === "boot") {
    show("vWait"); $("waitIcon").textContent = p.avatar; $("waitTitle").textContent = t("youreIn");
    $("waitSub").textContent = isHost ? t("hostHint") : t(CLOUD ? "lookHost" : "lookTv");
    var ids = Object.keys(state.players || {}), ro = $("roster"); ro.innerHTML = "";
    ids.forEach(function (id) { var pl = state.players[id], sp = document.createElement("span"); sp.textContent = pl.avatar + " " + pl.name; if (!pl.online) sp.style.opacity = ".45"; ro.appendChild(sp); });
    $("inviteBtn").style.display = CLOUD ? "block" : "none";
    $("startBtn").style.display = isHost ? "block" : "none"; $("startBtn").textContent = t("hostStart");
    answeredQ = -1;
  } else if (ph === "countdown") {
    show("vWait"); $("startBtn").style.display = "none";
    $("waitIcon").textContent = CLOUD ? "⏳" : "📺"; $("waitTitle").textContent = t("getReady"); $("waitSub").textContent = t(CLOUD ? "getReadyQ" : "eyes");
    $("roster").innerHTML = ""; $("inviteBtn").style.display = "none";
  } else if (ph === "question") {
    if (answeredQ === state.qIndex || p.answered) {
      show("vWait"); $("startBtn").style.display = "none"; $("roster").innerHTML = ""; $("inviteBtn").style.display = "none";
      $("waitIcon").textContent = "✅"; $("waitTitle").textContent = t("locked"); $("waitSub").textContent = t("waitOthers");
    } else {
      show("vAnswer");
      $("qn").textContent = t("question") + " " + state.qNum + "/" + state.qTotal;
      $("qt").textContent = "⏱ " + state.timeLeft;
      $("qq").textContent = state.q ? state.q.text : "";
      var box = $("opts");
      if (box.getAttribute("data-q") !== String(state.qIndex) + lang) {
        box.setAttribute("data-q", String(state.qIndex) + lang); box.innerHTML = "";
        (state.q ? state.q.options : ["", "", "", ""]).forEach(function (o, i) {
          var b = document.createElement("button"); b.className = "opt o" + i; b.type = "button";
          var sh = document.createElement("div"); sh.className = "sh"; sh.textContent = SHAPES[i];
          var tx = document.createElement("div"); tx.textContent = o;
          b.appendChild(sh); b.appendChild(tx);
          b.onclick = function () { answer(i); };
          box.appendChild(b);
        });
      }
    }
  } else if (ph === "reveal" || ph === "leader") {
    show("vResult");
    var r = $("result"), last = p.last, n = Object.keys(state.players).length;
    var key = "res" + state.qIndex;
    if (r.getAttribute("data-k") !== key) { r.setAttribute("data-k", key); buzz(last && last.correct ? [40, 60, 40] : 120); }
    r.className = "result " + (!last || last.choice < 0 ? "none" : last.correct ? "good" : "bad");
    var icon = !last || last.choice < 0 ? "⏰" : last.correct ? "🎉" : "😬";
    var title = !last || last.choice < 0 ? t("noAnswer") : last.correct ? t("correct") : t("wrong");
    r.innerHTML = "";
    var a = document.createElement("div"); a.className = "big"; a.textContent = icon;
    var b = document.createElement("div"); b.className = "title"; b.textContent = title; b.style.marginTop = "10px";
    r.appendChild(a); r.appendChild(b);
    if (last && last.correct) { var c = document.createElement("div"); c.className = "pts"; c.textContent = "+" + last.points; r.appendChild(c); }
    if (p.streak >= 2) { var s = document.createElement("div"); s.className = "muted"; s.textContent = "🔥 " + p.streak + " " + t("streak"); s.style.color = "#fff"; r.appendChild(s); }
    var rk = document.createElement("div"); rk.className = "rankbox"; rk.textContent = t("rank") + " #" + p.rank + " " + t("of") + " " + n;
    r.appendChild(rk);
    if (CLOUD && state.q && typeof state.correct === "number") {
      var al = document.createElement("div"); al.className = "answerline"; al.textContent = t("answerWas") + " " + state.q.options[state.correct]; r.appendChild(al);
    }
    if (CLOUD && state.fact) { var fb = document.createElement("div"); fb.className = "factbox"; fb.textContent = "💡 " + state.fact; r.appendChild(fb); }
  } else if (ph === "podium") {
    show("vFinal");
    $("medal").textContent = p.rank === 1 ? "🥇" : p.rank === 2 ? "🥈" : p.rank === 3 ? "🥉" : "🎖️";
    $("finalTitle").textContent = t("finalPlace") + " #" + p.rank;
    $("finalSub").textContent = p.score + " " + t("pts") + (isHost ? "" : "  •  " + t("waitHost"));
    $("againBtn").style.display = isHost ? "block" : "none"; $("againBtn").textContent = t("again");
  }
}

setLang("en");
show("vJoin");
if (CLOUD) {
  document.body.classList.add("remote");
  if (ROOM) connectRoom(); else roomMissing();
  beat = setInterval(heartbeat, 5000);
  document.addEventListener("visibilitychange", function () { if (!document.hidden) heartbeat(); });
} else {
  poll();
}
</script>
</body>
</html>
